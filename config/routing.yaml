# Which model answers, by how much of its usage window is already spent.
#
# Not keyword matching: the lead agent's job is the same whoever runs it, so
# the only question worth asking per turn is "which model can I still afford?".
# Each rung names a CLI and a model, and `until` is the point at which ANA
# stops using that rung and moves to the next one. The last rung has no
# `until` — it is where everything lands once the cheaper ones are spent.
#
# Utilization comes from the provider when it reports one (the Claude CLI's
# rate_limit_event) and from ANA's own token accounting otherwise; see
# packages/observability/limits.py. A rung whose usage is unknown counts as 0.
#
# `effort` is optional per rung: how hard that model should think. Each CLI has
# its own vocabulary and rejects the other's — claude takes
# low/medium/high/xhigh/max (--effort), codex takes minimal/low/medium/high
# (model_reasoning_effort). A rung that names none leaves it to the CLI (or to
# CLAUDE_EFFORT / CODEX_EFFORT in the environment). An effort the named CLI
# does not have is rejected when this file is saved, not at turn time.
#
# Editing this file takes effect on the next turn — no restart.

lead:
  - agent: claude
    model: fable
    effort: medium
    until:
      window: five_hour
      utilization: 0.25
  - agent: codex
    model: gpt-6-astra
    until:
      window: five_hour
      utilization: 0.25
  # Kimi before the expensive rung: it is another subscription, so a spent
  # Claude or Codex window is no reason to start paying for Opus. Its `until`
  # reads ANA's *own* token estimate rather than a provider figure — Kimi
  # reports no window utilization anywhere (see
  # docs/plans/2026-09-23-kimi-adapter.md) — so the threshold is loose.
  - agent: kimi
    model: kimi-code/k3
    effort: high
    until:
      window: five_hour
      utilization: 0.8
  # No longer the last rung, so it needs an `until`: a rung without one is
  # where everything lands, and the OpenCode rung below it would never be
  # reached. 0.95 is "the subscription is about to refuse anyway".
  - agent: claude
    model: opus
    effort: high
    until:
      window: five_hour
      utilization: 0.95
  # Last resort: OpenCode on a free model. It is one CLI in front of many
  # providers, so this is the rung that still answers when every subscription
  # above it is spent — at the quality a free model gives. Model names here
  # are `provider/model`; `opencode models` lists what the logged-in account
  # can actually reach.
  - agent: opencode
    model: opencode/space-bunny-free

# Sub-agents do the actual work (files, commands, edits), so they get the
# models that are good at it, with the same "spend the cheap window first"
# shape. `default` applies when the plan does not name a preference.
workers:
  default:
    - agent: codex
      model: gpt-6-astra
      effort: medium
      until:
        window: five_hour
        utilization: 0.9
    - agent: kimi
      model: kimi-code/k3
      effort: high
      until:
        window: five_hour
        utilization: 0.8
    - agent: claude
      model: opus
      until:
        window: five_hour
        utilization: 0.95
    # Same last resort as the lead ladder, for the same reason.
    - agent: opencode
      model: opencode/space-bunny-free
