# ANA MCP server registry — which MCP servers an agent may talk to.
#
# Roadmap stage 6: existing open-source servers are reused rather than
# rewritten, so this file is mostly a list of commands to spawn. Editing it
# needs no code change and no restart (it is re-read whenever the mtime
# changes, like config/governance.yaml).
#
# Per entry:
#   name          server id; the agent sees its tools as mcp__<name>__<tool>
#   command/args  the stdio server to spawn
#   env           environment for that server only, never for the agent
#   roles         which agent roles get the server ("lead", "worker").
#                 The gate limits lead calls to the scope selected per turn.
#   enabled       false keeps the entry as documentation without running it
#   requires_env  secret names that must be registered (Settings → Secrets)
#                 before the server is used; missing ones disable it quietly
#
# Placeholders substituted at build time:
#   {workspace}     this session's workspace directory
#   {database_url}  ANA's own Postgres DSN
#   {state_dir}     ANA's state directory
#   {secret:NAME}   a registered secret's value (never written to argv)

servers:
  # ① Git — the roadmap's first priority: commits, diffs, branches without
  # handing the agent a shell for them.
  # --repository is deliberately not passed: mcp-server-git exits at startup
  # if the path is not a git repository ("... is not a valid Git repository"),
  # and the default workspace is a plain directory — the server would then
  # expose no tools at all. Without it every tool takes `repo_path` per call,
  # and a path outside the session workspace still has to clear the gate's
  # workspace-escape rule.
  - name: git
    description: "로컬 git 저장소 조회/커밋 (mcp-server-git)"
    command: uvx
    args: ["mcp-server-git"]
    roles: [lead, worker]
    enabled: true

  # ② Postgres — the memory/state DB from stage 2, read-only.
  #
  # The DSN is given to *this server's* environment only. The agent's own
  # environment still has DATABASE_URL stripped (see env_builder), so the
  # agent can ask questions about the DB without holding credentials to it,
  # and --access-mode=restricted keeps the answers to reads.
  - name: postgres
    description: "ANA 메모리/상태 DB 읽기 전용 조회 (postgres-mcp)"
    # `--with "mcp<2"`: postgres-mcp still imports mcp.server.fastmcp, which
    # mcp 2.x renamed — without the pin the server dies at import with
    # "No module named 'mcp.server.fastmcp'" and exposes no tools.
    command: uvx
    args: ["--with", "mcp<2", "postgres-mcp", "--access-mode=restricted"]
    env:
      DATABASE_URI: "{database_url}"
    roles: [lead, worker]
    enabled: true

  # ③ GitHub — enabled only once a token is registered as a secret, since
  # without one every call fails at the API.
  - name: github
    description: "GitHub 이슈/PR (github-mcp-server, 토큰 등록 시에만 활성)"
    command: docker
    args:
      - run
      - "-i"
      - "--rm"
      - "-e"
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - "ghcr.io/github/github-mcp-server"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "{secret:GITHUB_PERSONAL_ACCESS_TOKEN}"
    requires_env: [GITHUB_PERSONAL_ACCESS_TOKEN]
    roles: [worker]
    enabled: true

  # ④ Ask — ANA's own server, available to every agent role.
  #
  # One tool, `ask_user`: it puts a question to the browser and waits for the
  # answer (packages/mcp/servers/ask_user.py). Everything else here flows one
  # way — the user asks, the agents work — so without this the lead had to
  # guess whenever the requirements forked, and a wrong guess only surfaces at
  # the end.
  #
  # A worker may also ask the user directly when its task needs an answer.
  #
  # `python -m` with PYTHONPATH rather than a path: the same image runs the
  # server and every workspace container, and /app is where ANA lives in both.
  # ⑥ Schedule — the agent putting work on a clock instead of promising to
  # remember. Scoped to the conversation the token belongs to; see
  # packages/mcp/servers/schedule.py.
  - name: schedule
    description: "이 대화에 반복 실행을 예약한다 (ANA 자체 서버)"
    command: python
    args: ["-m", "packages.mcp.servers.schedule"]
    env:
      PYTHONPATH: "/app"
      PYTHONUNBUFFERED: "1"
    roles: [lead]
    enabled: true

  - name: ask
    description: "사용자에게 직접 질문하고 답을 기다린다 (ANA 자체 서버)"
    command: python
    args: ["-m", "packages.mcp.servers.ask_user"]
    env:
      PYTHONPATH: "/app"
      PYTHONUNBUFFERED: "1"
    roles: [lead, worker]
    enabled: true
