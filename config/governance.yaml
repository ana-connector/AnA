# ANA governance rules — what a CLI agent may do without asking.
#
# Evaluated top to bottom; the first rule whose tool AND pattern match wins,
# so put explicit allowances above the broader blocks. `action` is:
#   deny  — never runs, the agent is told why
#   ask   — the user answers y/n in the web UI (no answer = denied)
#   allow — runs, and is still audited
#
# Patterns are Python regexes matched case-insensitively against the tool
# input: the `command` field for shell tools, otherwise the whole input
# serialized as JSON. Editing this file needs no code change.

default_action: allow

rules:
  # --- explicit allowances (must precede the blocks below) -----------------
  - id: git-status-and-read
    description: "저장소 상태를 읽기만 하는 git 명령"
    category: allowlist
    action: allow
    tools: [Bash]
    patterns:
      - '^\s*git\s+(status|diff|log|show|branch)\b'

  # Asking the user a question is not a tool call to be approved: the approval
  # card exists so a human decides, and this *is* the agent asking a human to
  # decide. Listed before the blocks below because the question text itself can
  # contain anything — "git push 해도 되나?" would otherwise match the
  # git-history-rewrite rule and hold the question behind an approval for the
  # question.
  - id: ask-user
    description: "에이전트가 사용자에게 질문을 보내는 호출"
    category: allowlist
    action: allow
    tools: [mcp__ask__ask_user, ask__ask_user, askask_user, request_user_input, request_user_input_async, functionsrequest_user_input, functionsrequest_user_input_async, functions.request_user_input, functions.request_user_input_async]
    patterns:
      - '[\s\S]*'

  # --- ANA modifying ANA ---------------------------------------------------
  # Editing ANA itself is normal work in an ANA workspace. Keep the audit
  # label, but do not stop an authorized repository change for another click.
  - id: ana-governance-self-edit
    description: "ANA 자신의 게이트 규칙·훅 코드를 고치려 한다. 허용하면 이후 도구 호출을 검사하는 기준이 바뀐다"
    category: self-modification
    action: allow
    tools: []
    patterns:
      - 'config/governance\.ya?ml'
      - 'packages/governance/(rules|hook|secrets)\.py'
      - 'ANA_GOVERNANCE_RULES'

  # --- filesystem destruction ---------------------------------------------
  - id: fs-recursive-force-delete
    description: "재귀·강제 삭제다. 지운 파일은 되돌릴 수 없다"
    category: filesystem-destruction
    action: deny
    tools: [Bash]
    patterns:
      - '\brm\b[^|;&]*\s-[a-z]*r[a-z]*f|\brm\b[^|;&]*\s-[a-z]*f[a-z]*r'
      - '\brm\b[^|;&]*--recursive[^|;&]*--force'
  - id: fs-delete-outside-workspace
    description: "워크스페이스 밖 시스템 경로를 지우거나 비우려 한다"
    category: filesystem-destruction
    action: ask
    tools: [Bash]
    patterns:
      - '\b(rm|shred|truncate)\b[^|;&]*\s/(etc|usr|var|boot|home|root|bin|sbin|lib)\b'
  - id: fs-disk-format
    description: "디스크 장치에 직접 쓴다. 파티션·파일시스템이 사라진다"
    category: filesystem-destruction
    action: deny
    tools: [Bash]
    patterns:
      - '\b(mkfs(\.\w+)?|fdisk|parted|dd)\b[^|;&]*\bof=/dev/'

  # --- database destruction -----------------------------------------------
  - id: db-drop
    description: "테이블·데이터베이스를 삭제하거나 비운다"
    category: database-destruction
    action: deny
    tools: [Bash]
    patterns:
      - '\bdrop\s+(table|database|schema)\b'
      - '\btruncate\s+table\b'
  - id: db-unscoped-write
    description: "WHERE 없는 DELETE/UPDATE다. 테이블 전체 행이 바뀐다"
    category: database-destruction
    action: deny
    tools: [Bash]
    patterns:
      # DELETE/UPDATE with no WHERE clause anywhere after it
      - '\bdelete\s+from\s+\w+\s*(;|$)'
      - '\bupdate\s+\w+\s+set\b(?![\s\S]*\bwhere\b)'

  # --- git history destruction --------------------------------------------
  - id: git-history-rewrite
    description: "커밋 이력을 다시 쓰거나 강제로 밀어넣는다. 남의 클론과 어긋날 수 있다"
    category: git-history-destruction
    action: ask
    tools: [Bash]
    patterns:
      - '\bgit\s+push\b[^|;&]*(--force\b|-f\b)'
      - '\bgit\s+reset\s+--hard\b'
      - '\bgit\s+(filter-branch|filter-repo)\b'
      - '\bgit\s+rebase\b[^|;&]*(-i|--interactive)\b'

  # --- system control ------------------------------------------------------
  - id: system-power-control
    description: "기계나 서비스를 끄려 한다"
    category: system-control
    action: deny
    tools: [Bash]
    patterns:
      - '\b(shutdown|reboot|halt|poweroff|systemctl\s+(stop|disable|mask))\b'
  - id: kill-everything
    description: "사용자 소유 프로세스를 모두 종료하려 한다"
    category: system-control
    action: deny
    tools: [Bash]
    patterns:
      # kill -1 targets every process the user owns; nothing legitimate does
      # that from an agent.
      - '\bkill\s+(-\w+\s+)?-1\b'
  - id: process-cleanup
    description: "프로세스를 강제 종료한다. 방금 띄운 개발 서버 정리일 수도, 중요한 프로세스일 수도 있다"
    category: system-control
    # `pkill -f "http.server 8421"` is how you clean up the dev server you
    # started a minute ago, so this asks instead of refusing: the pattern
    # cannot tell that apart from killing something important, but the user
    # can.
    action: ask
    tools: [Bash]
    patterns:
      - '\b(pkill|killall)\b'
      - '\bkill\s+-9\b'
  - id: container-control
    description: "컨테이너를 지우거나 멈춘다. 다른 워크스페이스의 컨테이너일 수도 있다"
    category: system-control
    action: ask
    tools: [Bash]
    patterns:
      - '\bdocker\s+(rm|kill|stop|system\s+prune)\b'
  - id: privilege-escalation
    description: "sudo로 권한을 올리려 한다"
    category: system-control
    action: deny
    tools: [Bash]
    patterns:
      - '\bsudo\b'

  # --- credential exfiltration --------------------------------------------
  - id: secret-file-egress
    description: "자격증명 파일을 읽어 외부로 보내는 형태다"
    category: credential-exfiltration
    action: deny
    tools: [Bash]
    patterns:
      # reading a secret file and piping it into something that leaves the box
      - '(\.env|\.aws/credentials|\.ssh/id_\w+|auth\.json|\.credentials\.json)[\s\S]*\b(curl|wget|nc|ssh|scp)\b'
      - '\b(curl|wget)\b[\s\S]*(\.env|\.aws/credentials|\.ssh/id_\w+)'

  # --- covering up failures (Replit incident) ------------------------------
  - id: log-or-test-tampering
    description: "테스트·로그 결과를 감추거나 지우는 형태다. 실패가 성공처럼 보일 수 있다"
    category: result-tampering
    action: ask
    tools: [Bash]
    patterns:
      - '>\s*/dev/null\s*2>&1[^|;&]*\b(test|pytest|npm\s+test|go\s+test)\b'
      - '\b(pytest|npm\s+test)\b[^|;&]*(--exitfirst\s+)?\|\|\s*true'
      - '\b(rm|mv|truncate|:>)\b[^|;&]*\.(log|jsonl)\b'

  # --- network egress ------------------------------------------------------
  # Publishing to a remote is a separate decision. Reading documentation,
  # fetching code and installing dependencies are ordinary development work.
  - id: git-push
    description: "원격 저장소에 커밋을 게시한다"
    category: network-egress
    action: ask
    tools: [Bash]
    patterns:
      - '\bgit\s+push\b'
  - id: network-egress
    description: "외부 자료를 읽거나 의존성을 설치한다"
    category: network-egress
    action: allow
    tools: [Bash]
    patterns:
      - '\b(curl|wget|nc|netcat|telnet|ssh|scp|rsync)\b'
      - '\b(pip|pip3|npm|pnpm|yarn|cargo|go)\s+(install|add|get)\b'
      - '\bgit\s+(clone|fetch|pull)\b'
