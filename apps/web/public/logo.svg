<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 55 189 189" width="189" height="189" role="img" aria-label="AnA">
  <!-- No canvas: the glyph alone, trimmed to its own bounds so it fills a
       16px tab, on whatever the browser puts behind it. The fill follows the
       viewer's colour scheme, which an SVG favicon is allowed to ask about -
       a fixed ink would disappear into one of the two tab strips. -->
  <style>
    path { fill: #121122 }
    @media (prefers-color-scheme: dark) { path { fill: #ffffff } }
  </style>
