name: code-review
title: 변경 리뷰
description: Review a change for correctness and report only what is wrong
roles: [worker]
inputs:
  - name: target
    type: string
    required: true
    description: What to review (a path, a directory, a diff range)
  - name: focus
    type: string
    required: false
    description: What to look at in particular (empty means correctness overall)
output:
  type: string
  description: "One finding per line: `path:line: problem. fix.`"
instructions: |
  Review the change in {{target}}. Focus: {{focus}}

  1. Read the changed code together with the places that call it. Do not judge
     from the changed lines alone.
  2. In this order: correctness (wrong result, crash) → missing error handling →
     duplication and excess complexity.
  3. One finding per line, as `path:line: problem. fix.` No praise, no summary,
     no style notes.
  4. Report only what you can explain a reproduction path for. If you are not
     sure, say so explicitly.
  5. If there is nothing wrong, say so in one line.

  Do not fix the code. This task ends at the review.
