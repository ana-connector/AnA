name: github-pr
title: GitHub PR/이슈 처리
description: Read a GitHub issue or PR and summarize it, or leave a comment
roles: [worker]
mcp: [github]
inputs:
  - name: target
    type: string
    required: true
    description: "Repository and number (e.g. owner/repo#123)"
  - name: action
    type: string
    required: false
    default: summarize
    description: "summarize | comment"
  - name: body
    type: string
    required: false
    description: What to post when action is comment
output:
  type: string
  description: The summary, or a link to the comment left
instructions: |
  Handle {{target}} with the github MCP server. Action: {{action}}

  1. Read the body, the latest comments and the list of changed files.
  2. For summarize: in 3-5 lines, what it asks for, where it stands, and what it
     is blocked on.
  3. For comment: post the following text as given. Do not rewrite it.
     {{body}}

  Do not: merge, close a branch or issue, or approve a review. If one of those is
  needed, hand it back to a person.
