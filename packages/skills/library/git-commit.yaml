name: git-commit
title: 변경사항 커밋
description: Read the working tree and commit one intent, Conventional Commits
roles: [worker]
mcp: [git]
inputs:
  - name: intent
    type: string
    required: true
    description: What this change was trying to do, in one line
  - name: scope
    type: string
    required: false
    description: Paths to include (empty means every change)
output:
  type: string
  description: The commit message and the commit hash
instructions: |
  Use the git MCP server, in this order.

  1. Read status and diff to see what actually changed.
     Limit to: {{scope}} (empty means every change)
  2. If the change mixes several intents, do not split it — report what is mixed
     and stop.
  3. If it is one intent, write the message in Conventional Commits form: an
     imperative one-line subject, and a body saying why. Intent: {{intent}}
  4. Commit, and report the hash.

  Do not: push, change branches, rewrite history, or revert someone else's
  uncommitted work.
