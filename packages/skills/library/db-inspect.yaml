name: db-inspect
title: 메모리 DB 조회
description: Answer a question from ANA's Postgres memory/state DB, read-only
roles: [worker]
mcp: [postgres]
inputs:
  - name: question
    type: string
    required: true
    description: The question to answer from the database
  - name: limit
    type: integer
    required: false
    default: 50
    description: Maximum rows to return
output:
  type: string
  description: The answer, with the queries it rests on
instructions: |
  Answer this question with the postgres MCP server: {{question}}

  1. Read the schema first to see which tables and columns exist. Do not guess
     table names.
  2. Run only the SELECTs you need. Limit results to {{limit}} rows.
  3. Include the queries you actually ran. Do not invent numbers.

  This server is read-only. If the answer would need a write or DDL, do not run
  it — report that instead.
