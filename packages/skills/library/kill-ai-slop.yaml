name: kill-ai-slop
title: AI 슬롭 제거
description: Find and strip the machine-default UI and copy tics (gradients, emoji, badge spam, AI voice)
roles: [worker]
inputs:
  - name: target
    type: string
    required: true
    description: What to scan (an app source directory, a file, Markdown copy)
  - name: apply
    type: boolean
    required: false
    default: false
    description: true fixes the approved groups after reporting; false reports only
output:
  type: string
  description: "`slop  path:line  what  → fix` lines, grouped, with counts"
# Adapted from yetone/kill-ai-slop (killaislop.com).
instructions: |
  Scope: {{target}}
  Apply fixes: {{apply}} (false or empty means report only)

  AI slop is ugly in a specific way: every possible style switched on at once
  with nothing chosen. The job is to strip it back to what a person would pick.

  [PRINCIPLES] Decide before you decorate · one accent, one voice · hierarchy
  from scale and space (coloring words or swapping fonts is a shortcut) ·
  subtract first · copy is specific, not punchy · decoration only when it means
  something.

  [1. SCOPE] App or site source only. Skip node_modules, dist, build, .git,
  vendor, lockfiles and minified files. If several apps are mixed, ask which.

  [2. SCAN] grep for the code-level signal of each tell. Add no dependency.
  - Color: `#6366f1`, `indigo-500.*purple`, `violet-`, `from-indigo.*to-purple`,
    `bg-clip-text`, `gradient`; status boxes whose border, text and background
    are one hue; the default semantic palette (info blue / tip amber / warning
    orange); a near-black page with a soft glow (`radial-gradient`, `blur-3xl`,
    `opacity-20`)
  - Type: one word in serif italic (`font-serif italic`); Playfair/Lora/
    Cormorant where sans belongs; a small uppercase kicker over every heading
    (`uppercase tracking-wide text-xs`); every size crammed between 14 and 24px
  - Copy: scattered highlighted keywords; "not just X — it's Y", "say goodbye
    to", "game-changing"; an emoji on every heading, button and bullet
  - Components: glowing status dots (`animate-ping`); `border-l-4` colored
    callouts; a rounded-square icon tile per feature; max radius plus
    glassmorphism (`backdrop-blur` + `bg-white/10`); oversized shadows
    (`shadow-2xl`); the same radius on every nested layer; badge and pill spam;
    model-drawn SVG icons; an icon wrapped in a tint of itself
  - Motion: springy hover on everything (`hover:scale-105
    transition-transform`); a spinner that wobbles off its center
  - Layout: ALL-CAPS label plus number card grids; invented stat rows ("10k+
    developers"); 01/02/03 section markers; cards inside cards; one spacing
    value everywhere (`gap-4`, `p-4`); the Inter + Space Grotesk default; the
    "tasteful terminal" (mono everywhere); an operational UI dressed as a
    magazine
  grep output is a map, not a verdict. Open each hit and read it.

  [3. TRIAGE] Per hit, decide slop or intentional. This is what separates this
  from a lint rule: a gradient, a serif or an emoji can be a real choice. Keep
  brand tokens, logos and deliberate illustration. Flag defaults only.

  [4. REPORT] Before changing anything, group the confirmed hits:
    slop  src/Hero.tsx:12  indigo→violet gradient   → one solid accent
    slop  src/Hero.tsx:31  gradient-clip headline   → solid ink, scale up
    slop  copy.md:1        "not just X — it's Y"    → say the specific thing
    → 3 groups, 11 hits
  Then ask which groups to apply.

  [5. FIX] Approved groups only, with the smallest change that removes the tell.
  Edit shared tokens and components rather than every call site. Invent no brand
  colors (propose neutrals plus the existing accent and let them confirm). Keep
  the meaning of copy — make it specific rather than deleting it. Re-scan
  afterwards to confirm the count dropped, and note anything you left on purpose
  with the reason.

  [GUARDRAILS] Respect authorship: treat unfamiliar files and deliberate
  flourishes as someone's choice, and ask rather than strip when unsure. Small
  reviewable diffs; never reformat unrelated code; never `git add -A` — stage the
  files you touched. No new dependencies. If a dev server exists, look at the
  before and after: a passing scan is not the same as a better page.
