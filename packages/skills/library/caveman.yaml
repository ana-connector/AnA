name: caveman
title: 압축 보고
description: Compress a report to its technical substance, dropping only filler
roles: [worker]
inputs:
  - name: subject
    type: string
    required: true
    description: What the report is about (a task result, an investigation)
  - name: level
    type: string
    required: false
    default: full
    description: "lite (filler only) | full (default) | ultra (maximum compression)"
output:
  type: string
  description: The compressed report. Code, error strings and numbers verbatim
# Adapted from JuliusBrussee/caveman.
instructions: |
  Report on: {{subject}}
  Level: {{level}} (empty means full)

  Keep every technical fact and drop the filler. Compression changes the style,
  never the content.

  [DROP] Greetings, apologies, "certainly"-style openers, hedges, needless
  qualifiers (just, really, basically, actually, simply), decorative tables and
  emoji, pasted raw logs nobody asked for (quote the single decisive line), and
  announcements of what you are about to do.

  [KEEP]
  - Negations (not, never, no, only, except) — never drop one. A flipped meaning
    costs more than any token saved.
  - Numbers and units, exactly.
  - Code blocks, commands, API names and error strings, verbatim.
  - Well-known acronyms (DB, API, HTTP), but invent no new abbreviations: a
    shortened word costs the same number of tokens and reads worse.
  - Plain phrasing where compression saves nothing. Never add a word to sound
    terse, and never let the output grow.

  [SHAPE] `[thing] [action] [reason]. [next step].`
  Example: "Bug in auth middleware. Token expiry check uses `<` not `<=`. Fix:"

  [WRITE IT OUT IN FULL] for security warnings, confirmations of irreversible
  actions, multi-step sequences whose order could be misread, and anywhere
  compression creates technical ambiguity. Resume compressing afterwards.

  [LANGUAGE] If this report is for the user rather than the lead, write it in
  their language; otherwise English. Never compress text that outlives the
  conversation: code, comments, commit messages, docs, issue and PR bodies.
