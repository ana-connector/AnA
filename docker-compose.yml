services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ana_dev_password}
      - POSTGRES_DB=ana
    ports:
      # Bound to localhost only: this DB holds ANA's own memory/checkpoint
      # state and has no auth layer beyond the password, which is a
      # documented dev-only placeholder (see .env.example) -- publishing on
      # 0.0.0.0 would make it reachable by anyone on the internal network.
      - "127.0.0.1:5432:5432"
    volumes:
      - ana_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ana"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /home/hello/workspace:/home/hello/workspace
      # read-write: the CLI persists session state here (what --session-id
      # creates and --resume reads); read-only breaks conversation continuity
      - ${HOME}/.claude:/root/.claude
    environment:
      - ANA_WORKSPACE_DIR=/home/hello/workspace
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-ana_dev_password}@postgres:5432/ana
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/chat}
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  ana_postgres_data:
