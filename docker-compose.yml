services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /home/hello/workspace:/home/hello/workspace
      - ${HOME}/.claude:/root/.claude:ro
    environment:
      - ANA_WORKSPACE_DIR=/home/hello/workspace

  web:
    build:
      context: apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/chat
    depends_on:
      - server
